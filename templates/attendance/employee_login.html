<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Login – QR Attendance</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #1e1b4b 0%, #4f46e5 50%, #06b6d4 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .card {
            width: 100%;
            max-width: 430px;
            background: #fff;
            border: none;
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: 0 20px 60px rgba(0,0,0,.25);
            animation: slideUp .4s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .icon-wrap {
            width: 64px; height: 64px;
            border-radius: 18px;
            background: linear-gradient(135deg, #4f46e5, #06b6d4);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 1.25rem;
            box-shadow: 0 8px 24px rgba(79,70,229,.4);
        }
        .form-control, .input-group-text {
            border-radius: 10px;
            border: 1.5px solid #e2e8f0;
            padding: .7rem 1rem;
            font-size: .9rem;
        }
        .form-control:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79,70,229,.12);
        }
        .input-group-text { border-radius: 10px 0 0 10px; background: #f8fafc; border-right: none; color: #94a3b8; }
        .input-group > .form-control { border-radius: 0 10px 10px 0; border-left: none; }
        .btn-login {
            background: linear-gradient(135deg, #4f46e5, #3730a3);
            border: none;
            border-radius: 10px;
            padding: .8rem;
            font-weight: 600;
            font-size: .95rem;
            color: #fff;
            width: 100%;
            transition: all .2s;
        }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(79,70,229,.4); color: #fff; }
    </style>
</head>
<body>

<div class="card">
    <div class="icon-wrap">
        <i class="bi bi-person-badge text-white" style="font-size:2rem;"></i>
    </div>

    <h4 class="text-center fw-bold mb-1" style="color:#1e1b4b;">Employee Login</h4>
    <p class="text-center text-muted mb-4" style="font-size:.875rem;">
        Sign in to record your attendance
    </p>

    {% if messages %}
        {% for msg in messages %}
        <div class="alert alert-{% if msg.tags == 'error' %}danger{% elif msg.tags %}{{ msg.tags }}{% else %}info{% endif %} rounded-3 border-0 py-2"
             style="font-size:.85rem;">
            <i class="bi bi-exclamation-circle me-1"></i>{{ msg }}
        </div>
        {% endfor %}
    {% endif %}

    <form method="post" novalidate>
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label fw-semibold" style="font-size:.85rem;">Username</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person"></i></span>
                <input type="text" name="username" class="form-control"
                       placeholder="Enter your username" autofocus required>
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label fw-semibold" style="font-size:.85rem;">Password</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" name="password" id="pwdInput"
                       class="form-control" placeholder="Enter your password" required>
            </div>
        </div>

        <button type="submit" class="btn-login">
            <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
        </button>
    </form>

    <p class="text-center text-muted mt-3 mb-2" style="font-size:.72rem;">
        <a href="{% url 'app:login' %}" class="text-decoration-none">Administrator? Sign in here</a>
    </p>
    <p class="text-center text-muted mb-0" style="font-size:.72rem;">
        Don't have an account?
        <a href="{% url 'app:employee_signup' %}" class="text-decoration-none fw-semibold">Sign up</a>
    </p>
</div>
</body>
</html>
