<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No Profile – QR Attendance</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #1e1b4b 0%, #4f46e5 50%, #06b6d4 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .card {
            width: 100%;
            max-width: 460px;
            background: #fff;
            border: none;
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: 0 20px 60px rgba(0,0,0,.25);
            text-align: center;
            animation: slideUp .4s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .icon-wrap {
            width: 72px; height: 72px;
            border-radius: 20px;
            background: linear-gradient(135deg, #f59e0b, #ea580c);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 1.5rem;
            box-shadow: 0 8px 24px rgba(234,88,12,.35);
        }

        .btn-primary-custom {
            background: linear-gradient(135deg, #4f46e5, #3730a3);
            border: none;
            color: #fff;
            border-radius: 10px;
            font-weight: 600;
            padding: .8rem 1.5rem;
        }
        .btn-primary-custom:hover { color: #fff; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(79,70,229,.4); }
    </style>
</head>
<body>

<div class="card">
    <div class="icon-wrap">
        <i class="bi bi-person-exclamation text-white" style="font-size:2.2rem;"></i>
    </div>

    <h4 class="fw-bold mb-2" style="color:#1e1b4b;">No Employee Profile</h4>
    <p class="text-muted mb-4" style="font-size:.875rem;">
        {% if error %}{{ error }}{% else %}
        Your account is not linked to an employee profile. Please contact your administrator.
        {% endif %}
    </p>

    <a href="{% url 'app:logout' %}" class="btn btn-primary-custom">
        <i class="bi bi-box-arrow-right me-2"></i>Logout
    </a>
</div>

</body>
</html>
